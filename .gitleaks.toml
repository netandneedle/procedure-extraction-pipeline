# gitleaks configuration — secret-detection rules for this repo.
#
# Inherits gitleaks' built-in default rules (which cover AWS, GitHub, GCP,
# Slack, generic API keys, RSA private keys, and ~100 other patterns).
# We add an explicit rule for Anthropic keys because the built-in catalogue
# may not flag the `sk-ant-api03-` prefix specifically.
#
# Run locally: gitleaks detect --source=. --verbose
# Run on history: gitleaks detect --source=. --log-opts="--all"
# Run on staged changes only (pre-commit hook): gitleaks protect --staged

title = "procedure-extraction-pipeline gitleaks config"

[extend]
# Inherit all default rules
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-api[0-9]{2}-[A-Za-z0-9_\-]{40,}'''
keywords = ["sk-ant-api"]
tags = ["key", "anthropic"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API key (sk- prefix)"
regex = '''sk-[A-Za-z0-9]{20,}'''
keywords = ["sk-"]
tags = ["key", "openai"]

[[rules]]
id = "huggingface-token"
description = "Hugging Face access token"
regex = '''hf_[A-Za-z0-9]{30,}'''
keywords = ["hf_"]
tags = ["key", "huggingface"]

# Files / paths to skip during scanning.
[allowlist]
description = "Allowlisted paths and patterns"
paths = [
  '''(.*?)\.lock$''',          # poetry/npm/yarn lock files (noisy false positives)
  '''node_modules/''',
  '''\.venv/''',
  '''data/attack/''',          # ATT&CK STIX bundles, not secrets
]
# Allow placeholder values in .env.example explicitly. The real .env files
# are in .gitignore so they shouldn't be scanned anyway.
regexes = [
  '''ANTHROPIC_API_KEY=$''',
  '''OPENAI_API_KEY=$''',
  '''LANGCHAIN_API_KEY=$''',
]
