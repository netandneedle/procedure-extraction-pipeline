name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pipeline
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pipeline"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pipeline:ci_only@localhost:5432/pipeline
      NEO4J_PASSWORD: ci_only
      NEO4J_WRITES_ENABLED: "false"
      ANTHROPIC_API_KEY: sk-ant-ci-dummy
      OPENAI_API_KEY: sk-ci-dummy
      # No model download in CI; the lexical retriever covers the same code paths.
      TECHNIQUE_RETRIEVER: token_overlap
      ATTACK_STIX_PATH: ${{ github.workspace }}/data/attack/enterprise-attack-19.2.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Fetch ATT&CK bundle
        run: scripts/fetch_attack.sh
      # Two suites, two configs: `pytest` at the root collects tests/ only;
      # backend/pytest.ini collects backend/tests/. Both must run.
      - name: Test (integration suite)
        run: pytest -q -rs
      - name: Test (backend suite)
        run: pytest -q -rs
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
